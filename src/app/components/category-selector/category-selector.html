<section aria-label="Elige una categoría" class="grid grid-cols-2 gap-3 sm:grid-cols-4">
  @for (cat of categorias; track cat.valor) {
    <button
      type="button"
      (click)="elegida.emit(cat.valor)"
      class="flex flex-col items-center gap-1 rounded-2xl border px-4 py-5 font-semibold shadow-lg transition hover:-translate-y-1"
      [class]="activa() === cat.valor
        ? 'border-amber-400 bg-amber-400/20 text-amber-300'
        : 'border-white/10 bg-white/5 text-slate-200 hover:bg-white/10'"
    >
      <span class="text-3xl">{{ cat.icon }}</span>
      <span>{{ cat.name }}</span>
    </button>
  }
</section>
