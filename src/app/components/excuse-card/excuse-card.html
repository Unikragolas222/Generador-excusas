<article class="overflow-hidden rounded-3xl border border-white/10 bg-white/5 shadow-2xl">

  @if (loading()) {
    <div class="flex flex-col items-center gap-4 p-12">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-white/20 border-t-amber-400"></div>
      <p class="text-slate-300">Inventando una excusa...</p>
    </div>
  } @else if (excuse()) {
        @if (gif()) {
      <div class="bg-black/40">
        <img
          [src]="gif()"
          alt="GIF relacionado con la excusa"
          class="h-64 w-full object-contain sm:h-96"
        />
      </div>
    }
    <div class="p-6 text-center sm:p-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-amber-400">Tu excusa</p>
      <blockquote class="mt-3 text-xl font-medium leading-relaxed sm:text-2xl">
        “{{ excuse() }}”
      </blockquote>
    </div>
  } @else {
    <p class="p-12 text-center text-slate-300">Elige una categoría para empezar</p>
  }

</article>
